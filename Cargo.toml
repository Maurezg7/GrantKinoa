[package]
name = "grantkinoa"
version = "0.1.0"
edition = "2024"
description = "DAW libre y gratuito estilo FL Studio hecho en Rust para Linux y Windows"
license = "MIT"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.37.0"
egui-file-dialog = { version = "0.16.0", default-features = false, features = ["default_fonts"] }
hound = "3.5.1"
midir = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
